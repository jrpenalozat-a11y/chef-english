<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Garzón Bilingüe — Idiomas para atender mesas</title>
<meta name="description" content="Academia de bolsillo para personal de servicio: aprende inglés, portugués y chino para atender mesas. 30 días, diccionario y frases del local. Funciona offline." />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f0d1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Garzón Bilingüe" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== Tokens: modo claro por defecto, .dark = noche ===== */
  :root{
    --bg1:#f3f1fb; --bg2:#eae6f7; --bg3:#f6eef0;
    --surface:#ffffff; --surface2:#f1edfa; --border:#e7e1f3;
    --text:#241f33; --soft:#6b6388; --target:#1a1530; --es:#5c5478; --pron:#8a7fb0;
    --accent:#6d4fff; --accent2:#0ea7cc; --on-accent:#ffffff;
    --shadow:0 6px 22px rgba(40,30,80,.08);
    --shadow-lg:0 18px 50px rgba(40,30,80,.18);
    --track:rgba(0,0,0,.07); --dotEmpty:rgba(0,0,0,.12);
  }
  body.dark{
    --bg1:#0f0d1a; --bg2:#141022; --bg3:#1a1226;
    --surface:#181426; --surface2:#221c34; --border:#2e2742;
    --text:#f3f0ff; --soft:#a89fc7; --target:#ffffff; --es:#bcb2dc; --pron:#9b8fd0;
    --accent:#8b6bff; --accent2:#3ccdf0; --on-accent:#ffffff;
    --shadow:0 8px 26px rgba(0,0,0,.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,.5);
    --track:rgba(255,255,255,.09); --dotEmpty:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--text);
    background:
      radial-gradient(1100px 600px at 12% -8%, var(--bg3) 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, var(--bg2) 0%, transparent 50%),
      var(--bg1);
    background-attachment:fixed; -webkit-tap-highlight-color:transparent;
    transition:background .4s ease, color .3s ease;
    padding-bottom:48px;
  }
  h1,h2,h3,.disp{font-family:'Sora',system-ui,sans-serif;}
  ::selection{background:var(--accent);color:#fff;}
  ::-webkit-scrollbar{height:7px;width:7px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;}
  .wrap{max-width:780px;margin:0 auto;width:100%;overflow-x:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* ===== Header ===== */
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 16px 12px;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1;}
  .brand>div{min-width:0;overflow:hidden;}
  .logo{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 22px rgba(109,79,255,.35);}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .sub{font-size:11.5px;color:var(--soft);margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hbtns{display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px;
    background:var(--surface2);border:1px solid var(--border);color:var(--soft);transition:all .2s;}
  .icon-btn:active{transform:scale(.92);}
  .streak{text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:13px;
    padding:6px 13px;flex-shrink:0;box-shadow:var(--shadow);}
  .streak .n{font-family:'Sora';font-weight:800;font-size:21px;line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .streak .l{font-size:8.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;line-height:1.1;margin-top:2px;font-weight:600;}

  /* ===== Progress ===== */
  .progress{padding:0 16px 12px;display:flex;align-items:center;gap:12px;}
  .bar{flex:1;height:9px;background:var(--track);border-radius:99px;overflow:hidden;}
  .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1);}
  .ptxt{font-size:12px;color:var(--soft);white-space:nowrap;font-weight:600;}

  /* ===== Nav ===== */
  nav{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  .navb{flex:0 0 auto;padding:9px 15px;border-radius:12px;font-weight:600;font-size:13.5px;white-space:nowrap;
    background:var(--surface2);border:1px solid var(--border);color:var(--soft);transition:all .2s;}
  .navb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(109,79,255,.32);}
  .navb.install{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(14,167,204,.34);}

  /* ===== Banner motivacional ===== */
  .motive{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:11px 15px;border-radius:14px;
    background:linear-gradient(120deg,rgba(109,79,255,.16),rgba(14,167,204,.16));border:1px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:transform .15s;line-height:1.4;}
  .motive:active{transform:scale(.99);}
  .motive .mi{font-size:17px;flex-shrink:0;}

  /* ===== Invitación app hermana (Protocolos de Servicio · turquesa) ===== */
  .sister{display:flex;align-items:center;gap:13px;margin:24px 16px 0;padding:15px 16px;border-radius:18px;text-decoration:none;
    background:linear-gradient(120deg,rgba(45,212,191,.16),rgba(45,212,191,.05));border:1px solid rgba(45,212,191,.5);
    color:var(--text);transition:transform .15s;}
  .sister:active{transform:scale(.99);}
  .sister-ic{font-size:26px;flex-shrink:0;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2dd4bf,#14b8a6);box-shadow:0 6px 18px rgba(45,212,191,.45);}
  .sister-tx{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;min-width:0;}
  .sister-tx b.t{font-size:14.5px;font-weight:700;}
  .sister-tx .d{color:var(--soft);}
  .sister-tx .go{color:#14b8a6;font-weight:700;}
  /* Familia de apps (enlaces cruzados) */
  .familia-apps{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 16px 0;}
  .familia-apps a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13.5px;font-weight:600;
    color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:8px 14px;transition:transform .15s;}
  .familia-apps a:active{transform:scale(.97);}

  /* ===== Day chips ===== */
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:9px;padding:2px 16px 14px;}
  .day{position:relative;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px 13px;
    display:flex;flex-direction:column;gap:7px;transition:all .2s;box-shadow:var(--shadow);}
  .day .check{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;background:#37d39b;color:#04140d;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(55,211,155,.5);}
  .day .peak-badge{position:absolute;top:7px;right:33px;font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));animation:peakPop .4s ease;}
  @keyframes peakPop{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
  .day:active{transform:scale(.97);}
  .day.on{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:var(--shadow-lg);}
  .day.done{border-color:var(--accent);}
  .day .dn{font-family:'Sora';font-weight:700;font-size:14.5px;color:var(--text);}
  .day.on .dn,.day.on .dt{color:#fff;}
  .day .dt{font-size:11px;color:var(--soft);line-height:1.25;min-height:28px;}
  .dots{display:flex;gap:4px;margin-top:1px;}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--dotEmpty);}
  .dot.f{background:var(--accent);}
  .day.on .dot{background:rgba(255,255,255,.35);}
  .day.on .dot.f{background:#fff;}

  /* ===== Tabs ===== */
  .tabs{display:flex;gap:8px;padding:0 16px 6px;}
  .tab{flex:1;padding:11px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface2);color:var(--soft);transition:all .2s;border:1px solid var(--border);}
  .tab.on{background:var(--text);color:var(--bg1);border-color:transparent;}
  .backbtn{display:inline-flex;align-items:center;gap:6px;margin:2px 16px 12px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;
    background:var(--surface2);color:var(--text);border:1px solid var(--border);transition:all .2s;cursor:pointer;}
  .backbtn:hover{background:var(--surface);transform:translateX(-2px);}
  .alttog{margin-top:11px;width:100%;text-align:left;background:transparent;border:1px dashed var(--border);color:var(--soft);
    padding:9px 12px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .alttog:hover,.alttog.on{color:var(--text);border-color:var(--accent);border-style:solid;}
  .altarrow{font-size:10px;color:var(--accent);}
  .altbox{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
  .altitem{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;}
  .alttext{font-weight:600;font-size:15.5px;color:var(--target);}
  .altpron{font-size:12.5px;color:var(--pron);margin-top:3px;}
  .altpron b{color:var(--soft);font-weight:600;}
  .altes{font-size:13.5px;color:var(--es);margin-top:3px;}
  .altnota{font-size:12px;color:var(--accent);margin-top:4px;font-style:italic;}
  .altlbtn{margin-top:9px;background:transparent;border:1px solid var(--border);color:var(--soft);padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;}
  .altlbtn:hover{border-color:var(--accent);color:var(--text);}
  .altlbtn.on{background:var(--accent);color:var(--on-accent);border-color:transparent;}
  .altitem.done-alt{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  /* Marcador de ESCALADA (frases extra) */
  .climb{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:13px 15px 11px;margin-bottom:13px;}
  .climb-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;}
  .climb-hito{color:var(--accent);font-size:12.5px;font-weight:700;}
  .climb-track{position:relative;height:9px;background:var(--border);border-radius:6px;margin:20px 0 9px;}
  .climb-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;}
  .climb-er{position:absolute;top:-13px;transform:translateX(-50%);font-size:18px;transition:left .4s;}
  .climb-peak{position:absolute;right:-7px;top:-12px;font-size:16px;}
  .climb-sub{font-size:12px;color:var(--soft);}

  /* ===== Content ===== */
  main{padding:14px 16px 0;}
  .sech{display:flex;align-items:baseline;gap:11px;margin-bottom:14px;flex-wrap:wrap;}
  .sech h2{font-size:21px;font-weight:800;letter-spacing:-.3px;}
  .sech .tag{font-size:13px;color:var(--accent2);font-weight:700;}
  .list{display:flex;flex-direction:column;gap:13px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);transition:border-color .2s, box-shadow .2s;position:relative;}
  .card.learned{border-color:var(--accent);box-shadow:0 6px 22px rgba(109,79,255,.18);}
  .numbadge{position:absolute;top:14px;right:14px;font-family:'Sora';font-weight:800;font-size:11px;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));width:24px;height:24px;border-radius:8px;display:grid;place-items:center;}
  .ttext{font-family:'Sora';font-weight:700;font-size:18.5px;line-height:1.32;color:var(--target);padding-right:30px;}
  .pron{font-size:12.5px;color:var(--pron);font-style:italic;margin:6px 0 8px;}
  .pron b{font-style:normal;font-weight:600;opacity:.8;}
  .es{font-size:14.5px;color:var(--es);margin-bottom:13px;line-height:1.4;}
  .row{display:flex;gap:8px;margin-bottom:10px;}
  .sbtn{flex:1;border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:12.5px;padding:7px 10px;border-radius:99px;transition:all .15s;}
  .sbtn:active{transform:scale(.96);}
  .sbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
  .lbtn{width:100%;padding:10px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--soft);font-weight:600;font-size:13.5px;transition:all .2s;}
  .lbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}

  /* ===== Flashcards ===== */
  .flash{min-height:128px;border-radius:18px;padding:22px 20px;background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;gap:9px;transition:all .25s;}
  .flash.back{background:linear-gradient(140deg,var(--accent),var(--accent2));border-color:transparent;}
  .fhint{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--soft);font-weight:700;}
  .fes{font-family:'Sora';font-size:18.5px;font-weight:700;color:var(--target);}
  .ftap{font-size:11.5px;color:var(--soft);}
  .ften{font-family:'Sora';font-size:19px;font-weight:700;color:#fff;line-height:1.3;}
  .flash.back .fpron{color:rgba(255,255,255,.85);font-size:12.5px;font-style:italic;margin-top:-2px;}
  .fbtn{align-self:flex-start;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:600;font-size:12.5px;padding:7px 15px;border-radius:99px;}

  /* ===== Search ===== */
  .search{display:block;width:100%;margin-bottom:14px;padding:12px 15px;border-radius:13px;font-size:14px;font-family:inherit;
    background:var(--surface);border:1px solid var(--border);color:var(--text);outline:none;}
  .search:focus{border-color:var(--accent);}

  /* ===== Local groups ===== */
  .grp{margin-bottom:22px;}
  .grp h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text);}

  /* ===== Footer ===== */
  footer{text-align:center;font-size:12.5px;color:var(--soft);padding:28px 16px 0;line-height:1.6;}
  footer .by{font-size:11px;opacity:.75;margin-top:6px;display:block;}

  .warn{margin:0 16px 12px;padding:10px 14px;border-radius:12px;background:rgba(240,161,58,.15);border:1px solid rgba(240,161,58,.6);color:#cf8a2a;font-size:12.5px;font-weight:600;line-height:1.5;}

  /* ===== Splash ===== */
  #splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(900px 600px at 30% 15%,#241a4a 0%,#140f26 55%,#0a0714 100%);}
  #splash.hide{opacity:0;pointer-events:none;transition:opacity .6s ease;}
  .sp-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:340px;width:100%;}
  .sp-logo{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;
    background:linear-gradient(135deg,#8b6bff,#3ccdf0);box-shadow:0 18px 55px rgba(139,107,255,.5);}
  .sp-title{font-family:'Sora';font-weight:800;font-size:33px;color:#fff;letter-spacing:-.5px;line-height:1.05;}
  .sp-words{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:-2px 0 2px;}
  .sp-words span{font-family:'Sora';font-weight:700;font-size:14px;color:#cfc2ff;opacity:0;transform:translateY(8px);
    animation:rise .6s ease forwards;}
  .sp-words span:nth-child(1){animation-delay:.15s;} .sp-words span:nth-child(2){animation-delay:.4s;} .sp-words span:nth-child(3){animation-delay:.65s;}
  .sp-words i{color:#7c6ab5;font-style:normal;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .sp-sub{font-size:14px;color:#b6a9e0;}
  .sp-by{font-size:11.5px;color:#7e72a8;margin-top:-6px;}
  .sp-langs{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px;}
  .sp-lang{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;width:100%;text-align:left;
    background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.13);transition:all .2s;}
  .sp-lang:active{transform:scale(.98);}
  .sp-lang:hover{border-color:#8b6bff;background:rgba(139,107,255,.16);}
  .sp-lang .fl{font-size:27px;}
  .sp-lang .nm{display:block;font-weight:700;font-size:16px;color:#fff;}
  .sp-lang .ds{display:block;font-size:12px;color:#a99ed0;margin-top:2px;}

  /* ===== Celebration ===== */
  #cel{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(10,7,20,.74);backdrop-filter:blur(3px);}
  #cel.show{display:flex;}
  .cel-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px 26px;max-width:340px;width:100%;
    text-align:center;box-shadow:var(--shadow-lg);position:relative;z-index:2;animation:pop .4s cubic-bezier(.2,1.3,.5,1);}
  @keyframes pop{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}
  .cel-emoji{font-size:54px;}
  .cel-card h2{font-size:25px;font-weight:800;margin:8px 0 4px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .cel-card p{font-size:14.5px;color:var(--es);line-height:1.5;margin-bottom:6px;}
  .cel-card .pc{font-size:13px;color:var(--soft);margin-bottom:18px;}
  .cel-btn{padding:13px 40px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(109,79,255,.4);}
  .cel-btn.alt{display:block;width:100%;margin-top:10px;padding:11px 20px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);box-shadow:none;font-size:14.5px;}
  .cel-btn.sister-btn{display:block;width:100%;margin-top:10px;padding:11px 20px;text-decoration:none;background:linear-gradient(135deg,#2dd4bf,#14b8a6);color:#04241f;box-shadow:0 10px 26px rgba(45,212,191,.4);font-size:14.5px;}
  .cel-btn.challenge{display:block;width:100%;margin-bottom:10px;}
  .cel-btn.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);box-shadow:none;}
  .confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:61;pointer-events:none;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2;}}

  /* ===== Quiz / Evaluación ===== */
  .q-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 20px;box-shadow:var(--shadow);}
  .q-ask{font-size:13px;color:var(--soft);font-weight:600;margin-bottom:6px;}
  .q-es{font-family:'Sora';font-weight:700;font-size:22px;color:var(--target);line-height:1.3;margin-bottom:18px;}
  .q-opts{display:flex;flex-direction:column;gap:10px;}
  .q-opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface2);color:var(--target);font-size:16px;font-weight:600;font-family:'Sora';transition:all .15s;}

      {en:"Would you care for a drink before your meal?",es:"¿Desea una bebida antes de la comida?",ipa:"wʊd juː kɛər fɔːr ə drɪŋk bɪˈfɔːr jɔːr miːl"},
      {en:"We have a nice house wine by the glass.",es:"Tenemos un buen vino de la casa por copa.",ipa:"wiː hæv ə naɪs haʊs waɪn baɪ ðə ɡlɑːs"},
      {en:"Can I get those drinks started for you?",es:"¿Le voy preparando esas bebidas?",ipa:"kæn aɪ ɡɛt ðoʊz drɪŋks ˈstɑːrtɪd fɔːr juː"},
      {en:"I'll be right back with your drinks.",es:"Vuelvo enseguida con sus bebidas.",ipa:"aɪl biː raɪt bæk wɪð jɔːr drɪŋks"}]},
    {day:18,theme:"Anotar el pedido con detalle",phrases:[
      {en:"And for your starter?",es:"¿Y de entrada?",ipa:"ænd fɔːr jɔːr ˈstɑːrtər"},
      {en:"Would you like that as a starter or a main?",es:"¿Lo desea como entrada o como plato principal?",ipa:"wʊd juː laɪk ðæt æz ə ˈstɑːrtər ɔːr ə meɪn"},
      {en:"Any sides with that?",es:"¿Alguna guarnición con eso?",ipa:"ˈɛni saɪdz wɪð ðæt"},
      {en:"Let me read that back to you.",es:"Permítame repetirle el pedido.",ipa:"lɛt miː riːd ðæt bæk tuː juː"},
      {en:"Would you like everything brought out together?",es:"¿Desea que traigamos todo junto?",ipa:"wʊd juː laɪk ˈɛvriθɪŋ brɔːt aʊt təˈɡɛðər"}]},
    {day:19,theme:"Modificar y personalizar",phrases:[
      {en:"Of course, I can leave the onions off.",es:"Por supuesto, puedo dejarlo sin cebolla.",ipa:"ɒv kɔːrs aɪ kæn liːv ðiː ˈʌnjənz ɒf"},
      {en:"Would you like the dressing on the side?",es:"¿Desea el aderezo aparte?",ipa:"wʊd juː laɪk ðə ˈdrɛsɪŋ ɒn ðə saɪd"},
      {en:"We can make that a smaller portion for the child.",es:"Podemos hacerlo en una porción más pequeña para el niño.",ipa:"wiː kæn meɪk ðæt ə ˈsmɔːlər ˈpɔːrʃən fɔːr ðə tʃaɪld"},
      {en:"Let me check if the kitchen can do that.",es:"Déjeme ver si la cocina puede hacerlo.",ipa:"lɛt miː tʃɛk ɪf ðə ˈkɪtʃən kæn duː ðæt"},
      {en:"Absolutely, no problem at all.",es:"Claro que sí, ningún problema.",ipa:"ˈæbsəluːtli noʊ ˈprɒbləm æt ɔːl"}]},
    {day:20,theme:"Servir los platos en mesa",phrases:[
      {en:"Here you are. Careful, the plate is hot.",es:"Aquí tiene. Cuidado, el plato está caliente.",ipa:"hɪər juː ɑːr ˈkɛərfəl ðə pleɪt ɪz hɒt"},
      {en:"Who ordered the grilled chicken?",es:"¿Quién pidió el pollo a la parrilla?",ipa:"huː ˈɔːrdərd ðə ɡrɪld ˈtʃɪkɪn"},
      {en:"Can I grind some fresh pepper on that?",es:"¿Le pongo pimienta recién molida?",ipa:"kæn aɪ ɡraɪnd sʌm frɛʃ ˈpɛpər ɒn ðæt"},
      {en:"Enjoy your meal!",es:"¡Que disfrute su comida!",ipa:"ɪnˈdʒɔɪ jɔːr miːl"},
      {en:"I'll bring the rest of your order in just a moment.",es:"Le traigo el resto del pedido en un momento.",ipa:"aɪl brɪŋ ðə rɛst ɒv jɔːr ˈɔːrdər ɪn dʒʌst ə ˈmoʊmənt"}]},
    {day:21,theme:"Atención durante la comida",phrases:[
      {en:"Is everything to your liking?",es:"¿Está todo a su gusto?",ipa:"ɪz ˈɛvriθɪŋ tuː jɔːr ˈlaɪkɪŋ"},
      {en:"Would you like some more bread?",es:"¿Desea más pan?",ipa:"wʊd juː laɪk sʌm mɔːr brɛd"},
      {en:"Shall I bring another round of drinks?",es:"¿Le traigo otra ronda de bebidas?",ipa:"ʃæl aɪ brɪŋ əˈnʌðər raʊnd ɒv drɪŋks"},
      {en:"May I clear this for you?",es:"¿Le retiro esto?",ipa:"meɪ aɪ klɪər ðɪs fɔːr juː"},
      {en:"Just wave me over if you need anything.",es:"Hágame una seña si necesita algo.",ipa:"dʒʌst weɪv miː ˈoʊvər ɪf juː niːd ˈɛniθɪŋ"}]},
    {day:22,theme:"Manejar mesas grandes",phrases:[
      {en:"Are you all together, or separate checks?",es:"¿Van todos juntos o cuentas separadas?",ipa:"ɑːr juː ɔːl təˈɡɛðər ɔːr ˈsɛprət tʃɛks"},
      {en:"I'll take the orders one by one, please.",es:"Tomaré los pedidos uno por uno, por favor.",ipa:"aɪl teɪk ðiː ˈɔːrdərz wʌn baɪ wʌn pliːz"},
      {en:"Let me pull up another chair for you.",es:"Le acerco otra silla.",ipa:"lɛt miː pʊl ʌp əˈnʌðər tʃɛər fɔːr juː"},
      {en:"I'll bring the children's plates out first.",es:"Sacaré primero los platos de los niños.",ipa:"aɪl brɪŋ ðə ˈtʃɪldrənz pleɪts aʊt fɜːrst"},
      {en:"Don't worry, I'll keep track of who had what.",es:"No se preocupe, llevaré la cuenta de quién pidió qué.",ipa:"doʊnt ˈwʌri aɪl kiːp træk ɒv huː hæd wɒt"}]},
    {day:23,theme:"Ofrecer postre y café",phrases:[
      {en:"Would you care to see the dessert menu?",es:"¿Desea ver la carta de postres?",ipa:"wʊd juː kɛər tuː siː ðə dɪˈzɜːrt ˈmɛnjuː"},
      {en:"Can I tempt you with something sweet?",es:"¿Le ofrezco algo dulce?",ipa:"kæn aɪ tɛmpt juː wɪð ˈsʌmθɪŋ swiːt"},
      {en:"Would you like coffee or tea with that?",es:"¿Desea café o té con eso?",ipa:"wʊd juː laɪk ˈkɒfi ɔːr tiː wɪð ðæt"},
      {en:"The desserts are perfect for sharing.",es:"Los postres son perfectos para compartir.",ipa:"ðə dɪˈzɜːrts ɑːr ˈpɜːrfɪkt fɔːr ˈʃɛərɪŋ"},
      {en:"How about a coffee to finish?",es:"¿Qué tal un café para terminar?",ipa:"haʊ əˈbaʊt ə ˈkɒfi tuː ˈfɪnɪʃ"}]},
    {day:24,theme:"Lidiar con esperas",phrases:[
      {en:"Thank you for your patience, it won't be long.",es:"Gracias por su paciencia, no tardará mucho.",ipa:"θæŋk juː fɔːr jɔːr ˈpeɪʃəns ɪt woʊnt biː lɒŋ"},
      {en:"Your food is just being plated now.",es:"Su comida se está emplatando ahora mismo.",ipa:"jɔːr fuːd ɪz dʒʌst ˈbiːɪŋ ˈpleɪtɪd naʊ"},
      {en:"I'm so sorry for the wait.",es:"Lamento mucho la espera.",ipa:"aɪm soʊ ˈsɒri fɔːr ðə weɪt"},
      {en:"Can I bring you some bread in the meantime?",es:"¿Le traigo algo de pan mientras tanto?",ipa:"kæn aɪ brɪŋ juː sʌm brɛd ɪn ðə ˈmiːntaɪm"},
      {en:"Let me check on that for you right away.",es:"Déjeme verificarlo enseguida.",ipa:"lɛt miː tʃɛk ɒn ðæt fɔːr juː raɪt əˈweɪ"}]},
    {day:25,theme:"Quejas en mesa con tacto",phrases:[
      {en:"I'm very sorry, let me make this right for you.",es:"Lo siento mucho, déjeme arreglarlo.",ipa:"aɪm ˈvɛri ˈsɒri lɛt miː meɪk ðɪs raɪt fɔːr juː"},
      {en:"Would you like me to bring you something else instead?",es:"¿Desea que le traiga otra cosa en su lugar?",ipa:"wʊd juː laɪk miː tuː brɪŋ juː ˈsʌmθɪŋ ɛls ɪnˈstɛd"},
      {en:"I completely understand, and I apologize.",es:"Lo entiendo perfectamente, y le pido disculpas.",ipa:"aɪ kəmˈpliːtli ˌʌndərˈstænd ænd aɪ əˈpɒlədʒaɪz"},
      {en:"I'll speak with my manager right away.",es:"Hablaré con mi encargado enseguida.",ipa:"aɪl spiːk wɪð maɪ ˈmænɪdʒər raɪt əˈweɪ"},
      {en:"Please accept this with our apologies.",es:"Por favor, acepte esto con nuestras disculpas.",ipa:"pliːz əkˈsɛpt ðɪs wɪð ˈaʊər əˈpɒlədʒiz"}]},
    {day:26,theme:"Comensales con apuro",phrases:[
      {en:"Are you in a hurry? I can speed things up.",es:"¿Tiene prisa? Puedo agilizarlo.",ipa:"ɑːr juː ɪn ə ˈhʌri aɪ kæn spiːd θɪŋz ʌp"},
      {en:"I'd recommend a dish that comes out quickly.",es:"Le recomendaría un plato que sale rápido.",ipa:"aɪd ˌrɛkəˈmɛnd ə dɪʃ ðæt kʌmz aʊt ˈkwɪkli"},
      {en:"I'll bring your bill with the food to save time.",es:"Le traeré la cuenta con la comida para ahorrar tiempo.",ipa:"aɪl brɪŋ jɔːr bɪl wɪð ðə fuːd tuː seɪv taɪm"},
      {en:"No problem, I'll have you out in time.",es:"Sin problema, lo dejaré listo a tiempo.",ipa:"noʊ ˈprɒbləm aɪl hæv juː aʊt ɪn taɪm"},
      {en:"Would you like that to go instead?",es:"¿Lo prefiere para llevar?",ipa:"wʊd juː laɪk ðæt tuː ɡoʊ ɪnˈstɛd"}]},
    {day:27,theme:"Ocasiones especiales en mesa",phrases:[
      {en:"Are you celebrating something special tonight?",es:"¿Celebran algo especial esta noche?",ipa:"ɑːr juː ˈsɛləbreɪtɪŋ ˈsʌmθɪŋ ˈspɛʃəl təˈnaɪt"},
      {en:"Happy birthday! This dessert is on us.",es:"¡Feliz cumpleaños! Este postre va por la casa.",ipa:"ˈhæpi ˈbɜːrθdeɪ ðɪs dɪˈzɜːrt ɪz ɒn ʌs"},
      {en:"Would you like me to bring it out with a candle?",es:"¿Desea que lo saque con una vela?",ipa:"wʊd juː laɪk miː tuː brɪŋ ɪt aʊt wɪð ə ˈkændəl"},
      {en:"Congratulations to you both!",es:"¡Felicitaciones a ambos!",ipa:"kənˌɡrætʃəˈleɪʃənz tuː juː boʊθ"},
      {en:"Let me know if there's anything I can do to make it memorable.",es:"Avíseme si puedo hacer algo para que sea memorable.",ipa:"lɛt miː noʊ ɪf ðɛərz ˈɛniθɪŋ aɪ kæn duː tuː meɪk ɪt ˈmɛmərəbəl"}]},
    {day:28,theme:"Cerrar la cuenta en mesa",phrases:[
      {en:"Whenever you're ready, there's no rush.",es:"Cuando guste, no hay prisa.",ipa:"wɛnˈɛvər jʊr ˈrɛdi ðɛərz noʊ rʌʃ"},
      {en:"Here is your bill. I'll take it whenever you're set.",es:"Aquí tiene la cuenta. La retiro cuando esté listo.",ipa:"hɪər ɪz jɔːr bɪl aɪl teɪk ɪt wɛnˈɛvər jʊr sɛt"},
      {en:"Would you like the receipt?",es:"¿Desea el comprobante?",ipa:"wʊd juː laɪk ðə rɪˈsiːt"},
      {en:"I'll be right back with your change.",es:"Vuelvo enseguida con su vuelto.",ipa:"aɪl biː raɪt bæk wɪð jɔːr tʃeɪndʒ"},
      {en:"Take your time, no hurry at all.",es:"Tómese su tiempo, sin ningún apuro.",ipa:"teɪk jɔːr taɪm noʊ ˈhʌri æt ɔːl"}]},

      {en:"My pleasure.",es:"Es un placer.",ipa:"maɪ ˈplɛʒər"},
      {en:"Right away, sir / madam.",es:"Enseguida, señor / señora.",ipa:"raɪt əˈweɪ sɜːr ˈmædəm"},
      {en:"I'll be with you in just a moment.",es:"Estaré con usted en un momento.",ipa:"aɪl biː wɪð juː ɪn dʒʌst ə ˈmoʊmənt"},
      {en:"Is there anything else I can get for you?",es:"¿Hay algo más que pueda traerle?",ipa:"ɪz ðɛər ˈɛniθɪŋ ɛls aɪ kæn ɡɛt fɔːr juː"},
      {en:"You're very welcome.",es:"De nada, con mucho gusto.",ipa:"jʊr ˈvɛri ˈwɛlkəm"}]},
    {day:30,theme:"Despedir al comensal",phrases:[
      {en:"Thank you for joining us tonight.",es:"Gracias por acompañarnos esta noche.",ipa:"θæŋk juː fɔːr ˈdʒɔɪnɪŋ ʌs təˈnaɪt"},
      {en:"I hope to see you again soon.",es:"Espero verle de nuevo pronto.",ipa:"aɪ hoʊp tuː siː juː əˈɡɛn suːn"},
      {en:"Mind the step on your way out.",es:"Cuidado con el escalón a la salida.",ipa:"maɪnd ðə stɛp ɒn jɔːr weɪ aʊt"},
      {en:"It was lovely having you with us.",es:"Fue un gusto tenerle con nosotros.",ipa:"ɪt wɒz ˈlʌvli ˈhævɪŋ juː wɪð ʌs"},

function getAlts(i){ try{ return (ALT[state.lang] && ALT[state.lang][state.day] && ALT[state.lang][state.day][i]) || []; }catch(e){ return []; } }
function altLearned(pi,ai){ return !!(state.alt[state.lang] && state.alt[state.lang][`${state.day}-${pi}-${ai}`]); }
// progreso de "frases extra" (alternativas) del día actual
function dayAltStats(){ return dayAltStatsOf(state.day); }
// progreso de frases extra de un día cualquiera (para la grilla)
function dayAltStatsOf(day){
  const lang=state.lang; let total=0, done=0;
  const block = ALT[lang] && ALT[lang][day];
  if(block){ block.forEach((arr,pi)=>{ if(!arr) return; total+=arr.length; arr.forEach((a,ai)=>{ if(state.alt[lang] && state.alt[lang][`${day}-${pi}-${ai}`]) done++; }); }); }
  return {done,total,pct: total?Math.round(done/total*100):0};
}
// día "reforzado": 5 frases dominadas + todos sus desafíos (extras) completos
function dayReforzado(day){ if(dayDone(day)!==5) return false; const s=dayAltStatsOf(day); return s.total>0 && s.done===s.total; }
// marcador de ESCALADA (solo si el día tiene frases extra)
function climbMarker(){
  const {done,total,pct}=dayAltStats();
  if(!total) return "";
  let hito;
  if(pct>=100) hito="🏔️ ¡Cumbre!";
  else if(pct>=70) hito="🧗 ¡Vas a la cima!";
  else if(pct>=40) hito="⛰️ ¡Subiendo firme!";
  else if(pct>0) hito="🥾 ¡En marcha!";
  else hito="🏕️ Campamento base";
  return `<div class="climb">
    <div class="climb-top"><span>🧗 Escalada de extras</span><span class="climb-hito">${hito}</span></div>
    <div class="climb-track"><div class="climb-fill" style="width:${pct}%"></div><span class="climb-er" style="left:${pct}%">🧗</span><span class="climb-peak">🏔️</span></div>
    <div class="climb-sub">${done} de ${total} frases extra aprendidas · ${pct}%</div>
  </div>`;
}

}

}

}
function intro(){
  if(!state.sound){ return; }
  const c=ac(); if(!c) return;
  try{
    const mel=[{f:523,t:.05},{f:659,t:.28},{f:784,t:.5},{f:1047,t:.72},{f:880,t:1.0},{f:1047,t:1.2}];
    mel.forEach(({f,t})=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";
      const tt=c.currentTime+t;o.frequency.setValueAtTime(f,tt);g.gain.setValueAtTime(0,tt);
      g.gain.linearRampToValueAtTime(.2,tt+.04);g.gain.exponentialRampToValueAtTime(.001,tt+.45);o.start(tt);o.stop(tt+.5);});
  }catch{}
}

let speakingKey=null;
function speak(text, slow){
  state.warn="";
  const synth=window.speechSynthesis;
  if(!synth || typeof SpeechSynthesisUtterance==="undefined"){ state.warn="Tu navegador no soporta voz. Prueba en Chrome o Edge."; renderWarn(); return; }
  const m=D().meta;
  const voices=synth.getVoices();
  let v=null;
  if(voices.length){
    // sólo voces del idioma destino (exacta o por prefijo): NUNCA leer con voz de otro idioma
    v = voices.find(x=>m.voiceMatch.test(x.lang)) || voices.find(x=>m.voiceFallback.test(x.lang)) || null;
    if(!v){
      state.warn="Tu dispositivo no tiene una voz en "+m.name+" instalada, por eso no se reproduce (para no leerlo con acento español). Instálala en los ajustes de tu teléfono → Idioma/Voz.";
      renderWarn(); setTimeout(()=>{ state.warn=""; renderWarn(); }, 6500);
      return;
    }
  }
  synth.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(v) u.voice=v;
  u.lang = v ? (v.lang||m.voiceLang) : m.voiceLang;
  u.rate = slow?0.35:0.85;
  const key = slow? text+"|s" : text;
  u.onstart=()=>{ speakingKey=key; markSpeaking(); };
  u.onend  =()=>{ speakingKey=null; markSpeaking(); };
  u.onerror=(e)=>{ speakingKey=null; markSpeaking(); if(e.error!=="interrupted"){ state.warn="Audio no disponible. Prueba en Chrome."; renderWarn(); setTimeout(()=>{state.warn="";renderWarn();},3000);} };
  synth.speak(u);
}
function markSpeaking(){
  document.querySelectorAll("[data-skey]").forEach(b=>{
    const on = b.getAttribute("data-skey")===speakingKey;
    b.classList.toggle("on", on);
    const lbl=b.getAttribute("data-lbl"); if(lbl){ b.textContent = on ? "◗ sonando…" : lbl; }
  });
}

const pkey=(lang,day,idx)=>`${lang}-${day}-${idx}`;
const dayDone=(day)=>D().curriculum.find(d=>d.day===day).phrases.filter((_,i)=>state.progress[pkey(state.lang,day,i)]).length;
function courseStats(){
  let done=0; const total=D().curriculum.length*5;
  D().curriculum.forEach(d=>d.phrases.forEach((_,i)=>{ if(state.progress[pkey(state.lang,d.day,i)]) done++; }));
  return {done,total,pct: total?Math.round(done/total*100):0};
}
function dictStats(){ const o=state.dict[state.lang]||{}; const done=Object.keys(o).filter(k=>o[k]).length; const total=D().words.length; return {done,total,pct: total?Math.round(done/total*100):0}; }
function quizScore(){ const o=state.quizDone[state.lang]||{}; const done=Object.keys(o).filter(k=>o[k]).length; const total=D().words.length; return {done,total,pct: total?Math.round(done/total*100):0}; }
function totalStats(){ const c=courseStats(), dc=dictStats(), q=quizScore(); const done=c.done+dc.done+q.done, total=c.total+dc.total+q.total; return {done,total,pct: total?Math.round(done/total*100):0}; }
function barColor(p){ return p>=67?"#37d39b":p>=34?"#ffb84d":"#ff5c5c"; }
const mainTerm = t => String(t).split("/")[0].split("(")[0].trim();   // término principal para TTS
function quizPool(){ const dn=state.quizDone[state.lang]||{}; return D().words.map((w,i)=>i).filter(i=>!dn[i]); }
function startQuiz(){
  const pool=quizPool();
  if(!pool.length){ state.quiz={done:true}; return; }
  state.quiz={ order:shuffle(pool), pos:0, answered:null, opts:[], wi:pool[0], done:false };
  buildQ();
}
function buildQ(){ const q=state.quiz; q.wi=q.order[q.pos]; const correct=tphrase(D().words[q.wi]);
  const pool=[...new Set(D().words.map(tphrase))].filter(t=>t!==correct);
  q.opts=shuffle([correct, ...shuffle(pool).slice(0,3)]); q.answered=null; }
function nextQ(){
  const q=state.quiz; if(!q || q.done){ startQuiz(); render(); return; }
  q.pos++;
  if(q.pos>=q.order.length){
    const pool=quizPool();                 // sólo las que aún no se aciertan (las falladas reaparecen, las correctas salen)
    if(!pool.length){ state.quiz={done:true}; render(); return; }
    q.order=shuffle(pool); q.pos=0;
  }
  buildQ(); render();
}

document.addEventListener("click", (e)=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.getAttribute("data-act");
  if(el.getAttribute("data-stop")) e.stopPropagation();

  if(act==="speak"){
    if(el.hasAttribute("data-slow")&&!el.hasAttribute("data-text")){} // flash buttons handled below
    let text=el.getAttribute("data-text");
    if(text==null){ // viene de flashcard: por índice del día
      const i=+el.getAttribute("data-idx"); text=tphrase(dayObj().phrases[i]);
    }
    speak(text, el.hasAttribute("data-slow"));
    return;
  }
  if(act==="nav"){ state.view=el.getAttribute("data-view"); state.search=""; if(state.view==="curso") state.dayOpen=false; if(state.view==="quiz"&&!state.quiz) startQuiz(); tick(); render(); window.scrollTo(0,0); return; }
  if(act==="day"){ state.day=+el.getAttribute("data-day"); state.dayOpen=true; state.flipped={}; state.altOpen={}; state.tab="learn"; tick(); render(); window.scrollTo(0,0); return; }
  if(act==="backdays"){ state.dayOpen=false; state.flipped={}; state.altOpen={}; tick(); render(); window.scrollTo(0,0); return; }
  if(act==="tab"){ state.tab=el.getAttribute("data-tab"); state.flipped={}; state.altOpen={}; tick(); render(); return; }
  if(act==="alt"){ const i=+el.getAttribute("data-idx"); state.altOpen[i]=!state.altOpen[i]; render(); return; }
  if(act==="altlearn"){
    const pi=+el.getAttribute("data-pi"), ai=+el.getAttribute("data-ai");
    const k=`${state.day}-${pi}-${ai}`;
    const was=state.alt[state.lang][k];
    if(was){ delete state.alt[state.lang][k]; } else { state.alt[state.lang][k]=true; bell(); }
    save("gbAlt",state.alt);
    const st=dayAltStats();
    render();
    if(!was && st.total>0 && st.done===st.total){ nextMotive(); celebrate("alt", ()=>{ state.dayOpen=false; state.flipped={}; state.altOpen={}; render(); window.scrollTo(0,0); }); }
    return;
  }
  if(act==="flip"){ const i=+el.getAttribute("data-idx"); state.flipped[i]=!state.flipped[i]; render(); return; }
  if(act==="motive"){ nextMotive(); tick(); return; }
  if(act==="dark"){ state.dark=!state.dark; save("gbDark",state.dark); render(); return; }
  if(act==="sound"){ state.sound=!state.sound; save("gbSound",state.sound); render(); return; }
  if(act==="share"){ shareApp(); return; }
  if(act==="install"){
    if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); }); }
    else {
      const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
      state.warn = ios
        ? "En iPhone/iPad: toca el botón Compartir y luego «Añadir a pantalla de inicio» para instalar la app."
        : "Para instalar: abre el menú del navegador (⋮ o ⋯) y elige «Instalar app» / «Agregar a la pantalla de inicio».";
      renderWarn(); setTimeout(()=>{ state.warn=""; renderWarn(); }, 8000);
    }
    return;
  }
  if(act==="pickopen"){ openSplash(); return; }
  if(act==="learn"){
    const i=+el.getAttribute("data-idx"); const k=pkey(state.lang,state.day,i);
    const was=state.progress[k];
    state.progress[k]=!was; if(!was) bell(); save("gbProgress",state.progress);
    const before = was? null : dayDone(state.day);
    render();
    if(!was && before===5){
      nextMotive();
      const as=dayAltStats();
      const hayDesafios = as.total>0 && as.done<as.total;
      celebrate(undefined,
        ()=>{ state.dayOpen=false; state.flipped={}; state.altOpen={}; render(); window.scrollTo(0,0); },
        hayDesafios ? ()=>{ state.altOpen={0:true,1:true,2:true,3:true,4:true}; render(); window.scrollTo(0,0); } : null
      );
    }
    return;
  }
  if(act==="dlearn"){
    const i=+el.getAttribute("data-idx");
    const was=state.dict[state.lang][i];
    state.dict[state.lang][i]=!was; if(!was) bell(); save("gbDict",state.dict);
    const dc=dictStats();
    render();
    if(!was && dc.done===dc.total){ celebrate("dict"); }
    return;
  }
  if(act==="ans"){
    const q=state.quiz; if(!q||q.answered) return;
    const chosen=el.getAttribute("data-opt");
    const correct=tphrase(D().words[q.wi]);
    q.answered={chosen,correct};
    let finished=false;
    if(chosen===correct){ if(!state.quizDone[state.lang][q.wi]){ state.quizDone[state.lang][q.wi]=true; save("gbQuiz",state.quizDone); } bell(); if(quizPool().length===0) finished=true; }
    else tick();
    render();
    if(finished) celebrate("quiz");
    return;
  }
  if(act==="qnext"){ nextQ(); return; }
  if(act==="qrestart"){ state.quizDone[state.lang]={}; save("gbQuiz",state.quizDone); startQuiz(); render(); return; }
});
// búsqueda del diccionario (sin perder foco)
document.addEventListener("input",(e)=>{
  if(e.target&&e.target.id==="searchBox"){
    state.search=e.target.value;
    const list=document.getElementById("dictList");
    if(list){
      const q=state.search.trim().toLowerCase();
      const items=D().words.map((w,idx)=>({w,idx})).filter(({w})=> !q || tphrase(w).toLowerCase().includes(q)||w.es.toLowerCase().includes(q));
      list.innerHTML=dictCards(items); markSpeaking();
    }
  }
});

//  SPLASH (selector de idioma)
// ============================================================
const splash=()=>document.getElementById("splash");
function buildSplash(){
  document.getElementById("spLogo").innerHTML=LOGO_SVG(56);
  document.getElementById("spLangs").innerHTML = LANGS.map(l=>{
    const m=DATA[l].meta;
    return `<button class="sp-lang" data-pick="${l}"><span class="fl">${m.flag}</span>
      <span><span class="nm">${m.pickLabel}</span><span class="ds">${esc(m.pickSub)}</span></span></button>`;
  }).join("");
}
function openSplash(){ splash().classList.remove("hide"); }
document.addEventListener("click",(e)=>{
  const b=e.target.closest("[data-pick]"); if(!b) return;
  state.lang=b.getAttribute("data-pick"); save("gbLang",state.lang);
  state.view="curso"; state.day=1; state.dayOpen=false; state.tab="learn"; state.flipped={}; state.search=""; state.quiz=null;
  ac(); intro();
  splash().classList.add("hide");
  sessionStorage.setItem("gbSplash","1");
  render();
});

// ── Frases del banner motivacional (rotan en la pantalla principal) ──
const MOTIVES = [
  "Cada palabra nueva es una propina más en tu bolsillo. 💸",
  "Un garzón bilingüe nunca dice «no entendí». 😎",
  "Hoy practicas, mañana atiendes turistas sin sudar. 🌍",

  "Practica una frase y serás el favorito de la mesa 12. ⭐",
  "Respira, sonríe y suelta el «welcome». Tú puedes. 💪",
  "Mientras otros dudan, tú ya tomaste el pedido en inglés. 🚀",
  "Pequeños pasos, grandes propinas. 🥂",

];
function updateMotive(){ const t=document.getElementById("motiveText"); if(t) t.textContent=MOTIVES[state.motive % MOTIVES.length]; }
function nextMotive(){ state.motive=(state.motive+1)%MOTIVES.length; updateMotive(); }

// ── Frases de celebración (cómicas/motivadoras por tramo de avance) ──
const CEL = {
  day:["¡Día completo! Tu inglés ya tiene más sazón que el plato del día. 😋",
       "¡Otro día dominado! Los turistas te van a adorar. 🌍",
       "¡Listo ese día! Vas camino a garzón estrella. ⭐"],
  m25:["25% y subiendo. Ya pides «the bill» sin que te tiemble la voz. 💪",
       "¡Un cuarto del camino! Pronto los gringos te pedirán a ti. 😎"],
  m50:["¡Mitad del curso! De aquí al «welcome» con acento de película. 🎬",
       "50%. Ya casi no necesitas señas para tomar el pedido. 🙌"],
  m75:["75%. Tu currículum ya huele a propina internacional. 💸",
       "¡Tres cuartos! Falta poco para jefe de sala. 👔"],
  m90:["¡90%! Ya hablas tan bien que el chef te pide traducir la carta, el sommelier te consulta los maridajes y los clientes juran que estudiaste en Londres. Un último empujón y eres LEYENDA del servicio. 🏆🔥"]
};
const pickFun = a => a[Math.floor(Math.random()*a.length)];
// Frases para la CUMBRE (al aprender todas las frases extra de un día)
const CEL_ALT = [
  "🏔️ ¡CUMBRE CONQUISTADA! Aprendiste hasta las frases extra de este día. Ya no atiendes mesas: las escalas. 🧗‍♂️🔥",
  "🏔️ ¡Llegaste a la cima! Con tantas formas de decir lo mismo, hasta el cliente más difícil queda sin palabras (y con buena propina 💸).",
  "🏔️ ¡Bandera en la cumbre! Manejas el plato principal Y las variantes. Eres oficialmente un sherpa del servicio. ⛰️✨",
  "🏔️ ¡Imparable! Subiste cada frase extra como quien sube escalones de dos en dos. El Everest del garzón es tuyo. 🚀"
];

function celebrate(kind,onClose,challengeFn){
  const st=totalStats();
  const cel=document.getElementById("cel");
  const alt=document.getElementById("celAlt");
  const sis=document.getElementById("celSister");
  const chal=document.getElementById("celChallenge");
  let title="¡Felicidades!", emoji="🎉", msg;
  if(st.pct>=100){
    emoji="🏆"; title="¡Todo completo!";
    msg="¡Completaste el curso, el diccionario y la evaluación de "+D().meta.name+"! Eres una leyenda. 🌟 Anímate con otro idioma o prueba Protocolos de Servicio.";
    alt.style.display=""; sis.style.display="";
  } else if(kind==="dict"){
    emoji="📚"; title="¡Diccionario completo!";
    msg="¡Aprendiste las "+dictStats().total+" palabras del diccionario de "+D().meta.name+"! Tu vocabulario quedó afiladísimo. ✨";
    alt.style.display="none"; sis.style.display="none";
  } else if(kind==="quiz"){
    emoji="🏅"; title="¡Evaluación superada!";
    msg="¡Acertaste todas las palabras de la evaluación de "+D().meta.name+"! Eres una máquina del servicio. 🔥";
    alt.style.display="none"; sis.style.display="none";
  } else if(kind==="alt"){
    emoji="🏔️"; title="¡Llegaste a la cumbre!";
    msg=pickFun(CEL_ALT);
    alt.style.display="none"; sis.style.display="none";
  } else {
    alt.style.display="none"; sis.style.display="none";
    const c=courseStats();
    if(c.pct>=100){ emoji="🎊"; title="¡30 días completos!"; msg="¡Terminaste los 30 días del curso de "+D().meta.name+"! Te faltan el diccionario y la evaluación para el 100%. 💪"; }
    else if(st.pct>=90){ emoji="🔥"; msg=pickFun(CEL.m90); }
    else if(st.pct>=75) msg=pickFun(CEL.m75);
    else if(st.pct>=50) msg=pickFun(CEL.m50);
    else if(st.pct>=25) msg=pickFun(CEL.m25);
    else msg=pickFun(CEL.day);
  }
  document.getElementById("celEmoji").textContent=emoji;
  document.getElementById("celTitle").textContent=title;
  document.getElementById("celMsg").textContent=msg;
  document.getElementById("celPc").textContent="Llevas "+st.pct+"% del curso de "+D().meta.name+".";
  cel.classList.add("show");
  fanfare(); confetti();
  // Botones: en celebraciones dentro de un día (día completo / cumbre) el botón principal vuelve a la grilla
  const btn=document.getElementById("celBtn");
  const volverGrilla = (kind===undefined || kind==="alt");
  btn.textContent = volverGrilla ? "← Volver a los días" : "Continuar";
  if(chal){ chal.style.display = challengeFn ? "" : "none"; }
  btn.classList.toggle("outline", !!challengeFn);  // si hay desafíos, "Volver" queda secundario
  const close=()=>{ cel.classList.remove("show"); if(onClose){ const cb=onClose; onClose=null; cb(); } };
  const safety=setTimeout(close,18000);
  btn.onclick=()=>{ clearTimeout(safety); close(); };
  if(chal) chal.onclick=()=>{ clearTimeout(safety); onClose=null; cel.classList.remove("show"); if(challengeFn) challengeFn(); };
  alt.onclick=()=>{ clearTimeout(safety); onClose=null; cel.classList.remove("show"); openSplash(); };
}
function confetti(){
  const cols=["#8b6bff","#3ccdf0","#5ad1c4","#ffd166","#6ea8ff"];
  for(let i=0;i<70;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*.6)+"s";
    c.style.transform="rotate("+Math.random()*360+"deg)";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}

// Compartir la app (Web Share API + respaldo WhatsApp)
async function shareApp(){
  tick();
  const url="https://chef-english.vercel.app/";
  const texto="🗣️ Garzón Bilingüe — aprende inglés, portugués y chino para atender mesas. Curso de 30 días, diccionario y quiz, ¡gratis! 👉";
  if(navigator.share){
    try{ await navigator.share({ title:"Garzón Bilingüe", text:texto, url }); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  window.open("https://wa.me/?text="+encodeURIComponent(texto+" "+url), "_blank");
}
